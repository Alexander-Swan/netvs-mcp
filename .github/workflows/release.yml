name: Release

# Versioning scheme:
# - Directory.Build.props tracks the current stable line plus a dev build number. For example,
#   after stable "1.2", dev builds are tagged "1.2.1-dev", "1.2.2-dev", etc.
# - "release" (stable) builds promote the current stable line to the next minor version, e.g.
#   "1.2.4-dev" releases as "1.3". The public tag/title has no build number or suffix, while
#   binaries are built as "1.3.0".
# - "dev"/"alpha" builds are versioned Major.Minor.Build-suffix, e.g. "1.0.12-dev",
#   "1.11.20-alpha" - Build only ever advances on a "dev" channel run (alpha runs reuse
#   whatever Build dev has already reached, labeled "-alpha", rather than keeping a separate
#   counter), and always counts up from the last stable release.
# - After a "release" run ships Major.Minor, the next cycle resumes on that stable line with
#   build counter 1: Major.Minor.1-dev.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
          - dev
          - alpha
          - release
        required: true
        default: dev
      ref:
        description: 'Git ref/SHA/tag to build from (for promoting an already-tested build). Leave empty to build from the branch default (master).'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $prefix = $props.Project.PropertyGroup.VersionPrefix
          $fileSuffix = $props.Project.PropertyGroup.VersionSuffix
          $channel = "${{ inputs.channel }}"
          $suffix = switch ($channel) {
            "dev" { $fileSuffix }
            "alpha" { "alpha" }
            "release" { "" }
            default { throw "Unknown channel: $channel" }
          }
          # Stable releases promote the current stable line to the next minor version and
          # display/tag as Major.Minor. Dev/alpha keep the full Major.Minor.Build so each
          # prerelease build since the last stable is distinguishable.
          $displayVersion = $prefix
          $buildPrefix = $prefix
          if ($channel -eq "release") {
            $parsed = [version]$prefix
            $releaseMinor = $parsed.Minor + 1
            $displayVersion = "$($parsed.Major).$releaseMinor"
            $buildPrefix = "$($parsed.Major).$releaseMinor.0"
          }
          $full = if ($suffix) { "$displayVersion-$suffix" } else { $displayVersion }
          "prefix=$prefix" >> $env:GITHUB_OUTPUT
          "build_prefix=$buildPrefix" >> $env:GITHUB_OUTPUT
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
          "full=$full" >> $env:GITHUB_OUTPUT
          "tag=v$full" >> $env:GITHUB_OUTPUT

      - name: Verify tag is new
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          if (git rev-parse -q --verify "refs/tags/$tag") {
            throw "Tag $tag already exists locally."
          }
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to check whether tag $tag exists on origin."
          }
          if ($remoteTag) {
            throw "Tag $tag already exists on origin."
          }

      - name: Run tests
        run: dotnet test tests/NetVsMcp.Broker.Tests/NetVsMcp.Broker.Tests.csproj -c Release

      - name: Build broker MSI
        # VersionSuffix must be overridden here (not just left to whatever's committed in
        # Directory.Build.props) so a "release" build's actual assembly metadata has no "-dev"
        # baked in - the wixproj's PublishBrokerForInstaller target inherits this as a global
        # MSBuild property when it publishes NetVsMcp.Broker.csproj.
        run: dotnet build src/NetVsMcp.Installer/NetVsMcp.Installer.wixproj -c Release /p:VersionPrefix=${{ steps.version.outputs.build_prefix }} /p:VersionSuffix=${{ steps.version.outputs.suffix }}

      - name: Patch VSIX manifest version
        shell: pwsh
        run: |
          $path = "src/NetVsMcp.Vsix/source.extension.vsixmanifest"
          $prefix = "${{ steps.version.outputs.build_prefix }}"
          [xml]$manifest = Get-Content $path
          $identity = $manifest.PackageManifest.Metadata.Identity
          if (-not $identity) {
            throw "Unable to find VSIX manifest Identity element."
          }
          $identity.Version = $prefix
          $manifest.Save((Resolve-Path $path).Path)

      - name: Build VSIX
        run: dotnet build src/NetVsMcp.Vsix/NetVsMcp.Vsix.csproj -c Release /p:VersionPrefix=${{ steps.version.outputs.build_prefix }} /p:VersionSuffix=${{ steps.version.outputs.suffix }}

      - name: Verify shipped binary version matches the intended channel version
        # Verify the produced binary version before publishing MSI/VSIX assets.
        shell: pwsh
        run: |
          $prefix = "${{ steps.version.outputs.build_prefix }}"
          $suffix = "${{ steps.version.outputs.suffix }}"
          $expectedInformational = if ($suffix) { "$prefix-$suffix" } else { $prefix }

          $brokerDll = Get-ChildItem -Recurse -Filter "NetVsMcp.Broker.dll" -Path "src/NetVsMcp.Broker/bin/Release" |
            Where-Object { $_.FullName -notmatch '\\refs?\\' } |
            Select-Object -First 1
          if (-not $brokerDll) {
            throw "Could not find built NetVsMcp.Broker.dll to verify its version."
          }

          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($brokerDll.FullName)
          Write-Host "NetVsMcp.Broker.dll ProductVersion: $($info.ProductVersion); FileVersion: $($info.FileVersion)"

          if ($info.ProductVersion -notlike "$expectedInformational*") {
            throw "NetVsMcp.Broker.dll ProductVersion '$($info.ProductVersion)' does not match the intended channel version '$expectedInformational'. Aborting before publishing a mis-versioned release."
          }

      - name: Collect release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "src/NetVsMcp.Installer/bin/Release/NetVsMcp.Broker.msi" "release-assets/NetVsMcp.Broker-${{ steps.version.outputs.full }}.msi"
          $vsix = Get-ChildItem -Recurse -Filter "NetVsMcp.Vsix.vsix" -Path "src/NetVsMcp.Vsix/bin/Release" | Select-Object -First 1
          if (-not $vsix) {
            throw "NetVsMcp.Vsix.vsix was not produced."
          }
          Copy-Item $vsix.FullName "release-assets/NetVsMcp.Vsix-${{ steps.version.outputs.full }}.vsix"

      - name: Generate release asset checksums
        shell: pwsh
        run: |
          # Publish SHA-256 sidecars for downloaded MSI verification.
          Get-ChildItem -Path release-assets -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -Path "$($_.FullName).sha256" -Value $hash -NoNewline -Encoding ascii
          }

      - name: Revert manifest patch
        if: always()
        run: git checkout -- src/NetVsMcp.Vsix/source.extension.vsixmanifest

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $full = "${{ steps.version.outputs.full }}"
          $suffix = "${{ steps.version.outputs.suffix }}"
          $prerelease = @()
          if ($suffix) {
            $prerelease = @("--prerelease")
          }

          git tag -a $tag -m "Release $full"
          git push origin $tag
          gh release create $tag release-assets/* --title "NetVsMcp $full" --generate-notes @prerelease

      - name: Publish VSIX to Visual Studio Marketplace
        if: inputs.channel == 'release'
        uses: madskristensen/publish-marketplace@v2
        with:
          extension-file: release-assets/NetVsMcp.Vsix-${{ steps.version.outputs.full }}.vsix
          publish-manifest-file: vs-publish.json
          personal-access-code: ${{ secrets.VS_MARKETPLACE_TOKEN }}

      - name: Bump version for next cycle
        # Ref promotions do not bump master's dev version.
        if: (inputs.channel == 'dev' || inputs.channel == 'release') && inputs.ref == ''
        shell: pwsh
        run: |
          $path = "Directory.Build.props"
          $content = Get-Content $path -Raw
          [xml]$props = $content
          $prefix = [version]$props.Project.PropertyGroup.VersionPrefix
          $channel = "${{ inputs.channel }}"
          if ($channel -eq "release") {
            # Resume dev on the newly released stable line.
            $nextPrefix = "$($prefix.Major).$($prefix.Minor + 1).1"
            $nextSuffix = "dev"
          } else {
            $nextPrefix = "$($prefix.Major).$($prefix.Minor).$($prefix.Build + 1)"
            $nextSuffix = "${{ steps.version.outputs.suffix }}"
          }
          $content = $content -replace '<VersionPrefix>[^<]*</VersionPrefix>', "<VersionPrefix>$nextPrefix</VersionPrefix>"
          $content = $content -replace '<VersionSuffix>[^<]*</VersionSuffix>', "<VersionSuffix>$nextSuffix</VersionSuffix>"
          Set-Content $path $content -NoNewline

      - name: Commit version bump
        # Retry the version-bump push if master moved during the release.
        if: (inputs.channel == 'dev' || inputs.channel == 'release') && inputs.ref == ''
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Directory.Build.props
          git commit -m "chore: bump version after releasing ${{ steps.version.outputs.full }}"

          $maxAttempts = 5
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            git push origin HEAD:master
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Version bump pushed to master on attempt $attempt."
              exit 0
            }

            if ($attempt -eq $maxAttempts) {
              break
            }

            Write-Host "Push failed (attempt $attempt/$maxAttempts) -- master likely moved. Fetching and rebasing before retrying."
            git fetch origin master
            git rebase origin/master
            if ($LASTEXITCODE -ne 0) {
              throw "Rebase onto origin/master failed -- Directory.Build.props likely conflicts with a concurrent change. Manual recovery required: check out master, verify VersionPrefix/VersionSuffix, and commit by hand."
            }
          }

          throw "Failed to push the version-bump commit to master after $maxAttempts attempts. Directory.Build.props is now stale relative to what was tagged/released as ${{ steps.version.outputs.full }} -- fix it manually before the next release run."

name: Release

# Versioning scheme:
# - Directory.Build.props tracks the current stable line plus a dev build number. For example,
#   after stable "1.2", dev builds are tagged "1.2.1-dev", "1.2.2-dev", etc.
# - "release" (stable) builds the current stable line from VersionPrefix, e.g.
#   "2.0.0-dev" releases as "2.0". The public tag/title has no patch number or
#   suffix, while binaries are built as "2.0.0".
# - "dev"/"alpha" builds are versioned Major.Minor.Build-suffix, e.g. "1.0.12-dev",
#   "1.11.20-alpha" - Build only ever advances on a "dev" channel run (alpha runs reuse
#   whatever Build dev has already reached, labeled "-alpha", rather than keeping a separate
#   counter), and always counts up from the last stable release.
# - Release runs do not bump Directory.Build.props automatically.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
          - dev
          - alpha
          - release
        required: true
        default: dev
      ref:
        description: 'Git ref/SHA/tag to build from (for promoting an already-tested build). Leave empty to build from the branch default (master).'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $prefix = $props.Project.PropertyGroup.VersionPrefix
          $fileSuffix = $props.Project.PropertyGroup.VersionSuffix
          $channel = "${{ inputs.channel }}"
          $suffix = switch ($channel) {
            "dev" { $fileSuffix }
            "alpha" { "alpha" }
            "release" { "" }
            default { throw "Unknown channel: $channel" }
          }
          # Stable releases display/tag as Major.Minor from the current VersionPrefix.
          # Dev/alpha keep the full Major.Minor.Build so each prerelease build is distinguishable.
          $displayVersion = $prefix
          $buildPrefix = $prefix
          if ($channel -eq "release") {
            $parsed = [version]$prefix
            $displayVersion = "$($parsed.Major).$($parsed.Minor)"
            $buildPrefix = "$($parsed.Major).$($parsed.Minor).0"
          }
          $full = if ($suffix) { "$displayVersion-$suffix" } else { $displayVersion }
          "prefix=$prefix" >> $env:GITHUB_OUTPUT
          "build_prefix=$buildPrefix" >> $env:GITHUB_OUTPUT
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
          "full=$full" >> $env:GITHUB_OUTPUT
          "tag=v$full" >> $env:GITHUB_OUTPUT

      - name: Verify tag is new
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          if (git rev-parse -q --verify "refs/tags/$tag") {
            throw "Tag $tag already exists locally."
          }
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to check whether tag $tag exists on origin."
          }
          if ($remoteTag) {
            throw "Tag $tag already exists on origin."
          }

      - name: Run broker tests
        run: dotnet test tests/NetVsMcp.Broker.Tests/NetVsMcp.Broker.Tests.csproj -c Release

      - name: Run VSIX tests
        run: dotnet test tests/NetVsMcp.Vsix.Tests/NetVsMcp.Vsix.Tests.csproj -c Release

      - name: Patch VSIX manifest version
        shell: pwsh
        run: ./scripts/set-vsix-version.ps1 -Version "${{ steps.version.outputs.build_prefix }}"

      - name: Build VSIX
        run: dotnet build src/NetVsMcp.Vsix/NetVsMcp.Vsix.csproj -c Release /p:VersionPrefix=${{ steps.version.outputs.build_prefix }} /p:VersionSuffix=${{ steps.version.outputs.suffix }}

      - name: Build standalone broker MSI
        run: dotnet build src/NetVsMcp.Installer/NetVsMcp.Installer.wixproj -c Release /p:ProductVersion=${{ steps.version.outputs.build_prefix }} /p:VersionPrefix=${{ steps.version.outputs.build_prefix }} /p:VersionSuffix=${{ steps.version.outputs.suffix }}

      - name: Verify standalone broker MSI payload is not marked as VSIX-bundled
        shell: pwsh
        run: |
          $marker = "artifacts/publish/NetVsMcp.Broker/.netvsmcp-vsix-bundled-broker"
          if (Test-Path $marker) {
            throw "Standalone broker MSI payload must not contain the VSIX-bundled marker file: $marker"
          }

      - name: Verify VSIX includes bundled broker
        shell: pwsh
        run: |
          $vsixPath = "src/NetVsMcp.Vsix/bin/Release/net472/NetVsMcp.Vsix.vsix"
          if (-not (Test-Path $vsixPath)) {
            throw "VSIX was not produced at $vsixPath."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $vsixPath))
          try {
            $entries = @{}
            foreach ($entry in $archive.Entries) {
              $entries[$entry.FullName] = $true
            }

            $required = @(
              "Broker/NetVsMcp.Broker.exe",
              "Broker/NetVsMcp.Broker.dll",
              "Broker/NetVsMcp.Broker.deps.json",
              "Broker/NetVsMcp.Broker.runtimeconfig.json",
              "Broker/.netvsmcp-vsix-bundled-broker",
              "Broker/BestPractices/manage-visual-studio.md"
            )

            foreach ($path in $required) {
              if (-not $entries.ContainsKey($path)) {
                throw "VSIX is missing required bundled broker payload entry: $path"
              }
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Verify VSIX manifest version
        shell: pwsh
        run: ./scripts/set-vsix-version.ps1 -Version "${{ steps.version.outputs.build_prefix }}" -VsixPath "src/NetVsMcp.Vsix/bin/Release/net472/NetVsMcp.Vsix.vsix"

      - name: Verify shipped binary version matches the intended channel version
        # Verify the produced binary version before publishing MSI/VSIX assets.
        shell: pwsh
        run: |
          $prefix = "${{ steps.version.outputs.build_prefix }}"
          $suffix = "${{ steps.version.outputs.suffix }}"
          $expectedInformational = if ($suffix) { "$prefix-$suffix" } else { $prefix }

          $brokerDll = Get-ChildItem -Recurse -Filter "NetVsMcp.Broker.dll" -Path "src/NetVsMcp.Broker/bin/Release" |
            Where-Object { $_.FullName -notmatch '\\refs?\\' } |
            Select-Object -First 1
          if (-not $brokerDll) {
            throw "Could not find built NetVsMcp.Broker.dll to verify its version."
          }

          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($brokerDll.FullName)
          Write-Host "NetVsMcp.Broker.dll ProductVersion: $($info.ProductVersion); FileVersion: $($info.FileVersion)"

          if ($info.ProductVersion -notlike "$expectedInformational*") {
            throw "NetVsMcp.Broker.dll ProductVersion '$($info.ProductVersion)' does not match the intended channel version '$expectedInformational'. Aborting before publishing a mis-versioned release."
          }

      - name: Collect release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $vsix = Get-ChildItem -Recurse -Filter "NetVsMcp.Vsix.vsix" -Path "src/NetVsMcp.Vsix/bin/Release" | Select-Object -First 1
          if (-not $vsix) {
            throw "NetVsMcp.Vsix.vsix was not produced."
          }
          Copy-Item $vsix.FullName "release-assets/NetVsMcp.Vsix-${{ steps.version.outputs.full }}.vsix"
          $msi = Get-ChildItem -Recurse -Filter "NetVsMcp.Broker.msi" -Path "src/NetVsMcp.Installer/bin/Release" | Select-Object -First 1
          if (-not $msi) {
            throw "NetVsMcp.Broker.msi was not produced."
          }
          Copy-Item $msi.FullName "release-assets/NetVsMcp.Broker-${{ steps.version.outputs.full }}.msi"

      - name: Generate release asset checksums
        shell: pwsh
        run: |
          # Publish SHA-256 sidecars for downloaded release asset verification.
          Get-ChildItem -Path release-assets -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -Path "$($_.FullName).sha256" -Value $hash -NoNewline -Encoding ascii
          }

      - name: Revert manifest patch
        if: always()
        run: git checkout -- src/NetVsMcp.Vsix/source.extension.vsixmanifest

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $full = "${{ steps.version.outputs.full }}"
          $suffix = "${{ steps.version.outputs.suffix }}"
          $prerelease = @()
          if ($suffix) {
            $prerelease = @("--prerelease")
          }

          git tag -a $tag -m "Release $full"
          git push origin $tag
          gh release create $tag release-assets/* --title "NetVsMcp $full" --generate-notes @prerelease

      - name: Publish VSIX to Visual Studio Marketplace
        if: inputs.channel == 'release'
        uses: madskristensen/publish-marketplace@v2
        with:
          extension-file: release-assets/NetVsMcp.Vsix-${{ steps.version.outputs.full }}.vsix
          publish-manifest-file: vs-publish.json
          personal-access-code: ${{ secrets.VS_MARKETPLACE_TOKEN }}


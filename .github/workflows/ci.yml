name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build NetVsMcp.slnx -c Debug /m:1 /p:UseSharedCompilation=false /nodeReuse:false

      - name: Verify VSIX includes bundled broker
        shell: pwsh
        run: |
          $vsixPath = "src/NetVsMcp.Vsix/bin/Debug/net472/NetVsMcp.Vsix.vsix"
          if (-not (Test-Path $vsixPath)) {
            throw "VSIX was not produced at $vsixPath."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $vsixPath))
          try {
            $entries = @{}
            foreach ($entry in $archive.Entries) {
              $entries[$entry.FullName] = $true
            }

            $required = @(
              "Broker/NetVsMcp.Broker.exe",
              "Broker/NetVsMcp.Broker.dll",
              "Broker/NetVsMcp.Broker.deps.json",
              "Broker/NetVsMcp.Broker.runtimeconfig.json",
              "Broker/.netvsmcp-vsix-bundled-broker",
              "Broker/BestPractices/manage-visual-studio.md"
            )

            foreach ($path in $required) {
              if (-not $entries.ContainsKey($path)) {
                throw "VSIX is missing required bundled broker payload entry: $path"
              }
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Test broker
        run: dotnet test tests/NetVsMcp.Broker.Tests/NetVsMcp.Broker.Tests.csproj -c Debug --no-build

      - name: Test VSIX
        run: dotnet test tests/NetVsMcp.Vsix.Tests/NetVsMcp.Vsix.Tests.csproj -c Debug --no-build

name: Publish Marketplace

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref/SHA/tag to publish from. Leave empty to use the selected branch.'
        type: string
        required: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build VSIX
        run: dotnet build src/NetVsMcp.Vsix/NetVsMcp.Vsix.csproj -c Release

      - name: Publish VSIX to Visual Studio Marketplace
        uses: madskristensen/publish-marketplace@v2
        with:
          extension-file: src/NetVsMcp.Vsix/bin/Release/net472/NetVsMcp.Vsix.vsix
          publish-manifest-file: vs-publish.json
          personal-access-code: ${{ secrets.VS_MARKETPLACE_TOKEN }}

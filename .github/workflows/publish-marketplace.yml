name: Publish Marketplace

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref/SHA/tag to publish from. Leave empty to use the selected branch.'
        type: string
        required: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $requestedRef = "${{ inputs.ref }}"
          $workflowRefName = "${{ github.ref_name }}"
          $sourceRef = if ($requestedRef) { $requestedRef } else { $workflowRefName }
          $prefix = $null

          if ($sourceRef -match '^refs/tags/v(?<version>\d+(?:\.\d+){1,3})(?:-[^/]+)?$' -or
              $sourceRef -match '^v(?<version>\d+(?:\.\d+){1,3})(?:-[^/]+)?$') {
            $parsed = [version]$Matches.version
            $build = if ($parsed.Build -ge 0) { $parsed.Build } else { 0 }
            $prefix = "$($parsed.Major).$($parsed.Minor).$build"
          }
          else {
            [xml]$props = Get-Content Directory.Build.props
            $prefix = $props.Project.PropertyGroup.VersionPrefix
          }

          if (-not $prefix) {
            throw "Unable to determine VSIX version from ref '$sourceRef' or Directory.Build.props."
          }
          "prefix=$prefix" >> $env:GITHUB_OUTPUT

      - name: Patch VSIX manifest version
        shell: pwsh
        run: ./scripts/set-vsix-version.ps1 -Version "${{ steps.version.outputs.prefix }}"

      - name: Build VSIX
        run: dotnet build src/NetVsMcp.Vsix/NetVsMcp.Vsix.csproj -c Release /p:VersionPrefix=${{ steps.version.outputs.prefix }} /p:VersionSuffix=

      - name: Verify VSIX includes bundled broker
        shell: pwsh
        run: |
          $vsixPath = "src/NetVsMcp.Vsix/bin/Release/net472/NetVsMcp.Vsix.vsix"
          if (-not (Test-Path $vsixPath)) {
            throw "VSIX was not produced at $vsixPath."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $vsixPath))
          try {
            $entries = @{}
            foreach ($entry in $archive.Entries) {
              $entries[$entry.FullName] = $true
            }

            $required = @(
              "Broker/NetVsMcp.Broker.exe",
              "Broker/NetVsMcp.Broker.dll",
              "Broker/NetVsMcp.Broker.deps.json",
              "Broker/NetVsMcp.Broker.runtimeconfig.json",
              "Broker/.netvsmcp-vsix-bundled-broker",
              "Broker/BestPractices/manage-visual-studio.md"
            )

            foreach ($path in $required) {
              if (-not $entries.ContainsKey($path)) {
                throw "VSIX is missing required bundled broker payload entry: $path"
              }
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Verify VSIX manifest version
        shell: pwsh
        run: ./scripts/set-vsix-version.ps1 -Version "${{ steps.version.outputs.prefix }}" -VsixPath "src/NetVsMcp.Vsix/bin/Release/net472/NetVsMcp.Vsix.vsix"

      - name: Publish VSIX to Visual Studio Marketplace
        uses: madskristensen/publish-marketplace@v2
        with:
          extension-file: src/NetVsMcp.Vsix/bin/Release/net472/NetVsMcp.Vsix.vsix
          publish-manifest-file: vs-publish.json
          personal-access-code: ${{ secrets.VS_MARKETPLACE_TOKEN }}
